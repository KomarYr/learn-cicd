name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build the app
        run: ./scripts/buildprod.sh

      - name: Google WIF auth   
        uses: google-github-actions/auth@v3
        with: 
          workload_identity_provider: 'projects/1000399129907/locations/global/workloadIdentityPools/github/providers/my-repo'
          service_account: 'cloud-run-deployer@notely-515816.iam.gserviceaccount.com'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push the Docker image to GAR
        run: gcloud builds submit --tag europe-southwest1-docker.pkg.dev/notely-515816/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image=europe-southwest1-docker.pkg.dev/notely-515816/notely-ar-repo/notely:latest \
            --region=europe-southwest1 \
            --allow-unauthenticated \
            --project notely-515816 \
            --max-instances=4
