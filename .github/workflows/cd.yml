name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build the app
        run: ./scripts/buildprod.sh
